[project]
name = "qcref"
version = "0.3.0"
description = "Lightweight, dependency-free chemistry reference data (CODATA constants, periodic table, solvents) where every value carries its source."
readme = "README.md"
authors = [{ name = "Colton Hicks", email = "github@coltonhicks.com" }]
requires-python = ">=3.10"
dependencies = []
license = { file = "LICENSE" }

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
keywords = [
    "reference data",
    "constants",
    "periodic table",
    "scientific computing",
    "conversion factors",
    "chemistry",
    "physics",
]

[project.urls]
Homepage = 'https://github.com/atomsforhumanity/qcref'
Documentation = 'https://github.com/atomsforhumanity/qcref#readme'
Source = 'https://github.com/atomsforhumanity/qcref'
Changelog = 'https://github.com/atomsforhumanity/qcref/blob/master/CHANGELOG.md'
"Bug Tracker" = 'https://github.com/atomsforhumanity/qcref/issues'

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.1",
    "toml>=0.10.2",
    "types-tabulate>=0.9.0.20241207",
    "types-toml>=0.10.8.20240310",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "build_tools/build_hook.py"

[tool.ruff]
exclude = [".venv"]
line-length = 88
target-version = "py310"

[tool.coverage.run]
branch = true
source = ["qcref"]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint]
isort = { known-first-party = ["qcref", "tests"] }
select = ["I", "F401"]

[tool.mypy]
ignore_missing_imports = true
[tool.hatch.build.targets.sdist]
exclude = ["compat", "*.pdf"]
