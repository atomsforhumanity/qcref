[project]
name = "qcref"
version = "0.5.0"
description = "Lightweight, dependency-free chemistry reference data (CODATA constants, periodic table, solvents) where every value carries its source."
readme = "README.md"
authors = [{ name = "Colton Hicks", email = "github@coltonhicks.com" }]
requires-python = ">=3.11"
dependencies = []
license = { file = "LICENSE" }

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
keywords = [
    "reference data",
    "constants",
    "periodic table",
    "scientific computing",
    "conversion factors",
    "chemistry",
    "physics",
]

[project.urls]
Homepage = 'https://github.com/atomsforhumanity/qcref'
Documentation = 'https://github.com/atomsforhumanity/qcref#readme'
Source = 'https://github.com/atomsforhumanity/qcref'
Changelog = 'https://github.com/atomsforhumanity/qcref/blob/master/CHANGELOG.md'
"Bug Tracker" = 'https://github.com/atomsforhumanity/qcref/issues'

[dependency-groups]
dev = [
    "detect-secrets>=1.5",
    "mypy>=1.15",
    "pre-commit>=4.0",
    "pre-commit-hooks>=5.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "toml>=0.10.2",
    "types-tabulate>=0.9.0.20241207",
    "types-toml>=0.10.8.20240310",
    "typos>=1.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "build_tools/build_hook.py"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["E501"] # line length is the formatter's job

[tool.ruff.lint.isort]
known-first-party = ["qcref", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"docs/**" = ["D"]
"examples/**" = ["D"]
"build_tools/**" = ["D"]
# Generated keys are element symbols; O and I are legitimate names here.
"src/qcref/_keys.py" = ["E741"]

[tool.coverage.run]
branch = true
source = ["qcref"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts", "build_tools"]
ignore_missing_imports = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.hatch.build.targets.sdist]
exclude = ["compat", "*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
